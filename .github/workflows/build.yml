name: Build copy-tree

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall src tests

      - name: Run tests
        run: python -m unittest discover -s tests

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall src tests

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build exe
        run: python -m PyInstaller copy-tree.spec --noconfirm

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash dist/copy-tree.exe, dist/copy-tree-cli.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = (Select-String -Path src/copytree/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $releaseName = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$version" }
          @"
          ## copy-tree $releaseName

          copy-tree 是一个 Windows 目录树复制工具，支持资源管理器右键菜单和独立命令行入口。

          ### 版本亮点
          - `copy-tree.exe` 负责右键菜单、安装、更新、修复、卸载、复制操作和 Windows 原生通知。
          - `copy-tree-cli.exe` 负责命令行使用场景，适合 stdout、管道、重定向和脚本调用。
          - 安装后会在 `%LOCALAPPDATA%\copy-tree` 下创建稳定副本，避免误删下载目录中的 exe 后右键菜单失效。
          - 支持文本、Markdown 代码块、Markdown 列表和 JSON 输出格式。
          - 提供 `--stdout-only`、`--no-clipboard`、`--check-config` 等实用命令行选项。
          - Release 附带 `SHA256SUMS.txt`，便于校验下载文件完整性。

          ### 下载说明
          - `copy-tree.exe`：双击后可安装、更新、修复或卸载；资源管理器右键菜单也使用这个入口。
          - `copy-tree-cli.exe`：用于终端和脚本，不负责安装或卸载。
          - `SHA256SUMS.txt`：两个 exe 文件的 SHA256 校验值。
          "@ | Set-Content -Encoding utf8 dist/RELEASE_NOTES.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: copy-tree
          path: |
            dist/copy-tree.exe
            dist/copy-tree-cli.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $apiBase = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseBody = Get-Content -Raw -Encoding UTF8 dist/RELEASE_NOTES.md
          $payload = @{
            tag_name = $tag
            name = "copy-tree $tag"
            body = $releaseBody
            draft = $false
            prerelease = $false
          } | ConvertTo-Json -Depth 5

          try {
            $release = Invoke-RestMethod -Headers $headers -Uri "$apiBase/releases/tags/$tag"
            $release = Invoke-RestMethod -Method Patch -Headers $headers -ContentType "application/json" -Uri "$apiBase/releases/$($release.id)" -Body $payload
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -ne 404) {
              throw
            }
            # /releases/tags 不返回 draft；存在同名草稿时改为 Patch，避免创建时撞 422
            $draft = Invoke-RestMethod -Headers $headers -Uri "$apiBase/releases?per_page=100" |
              Where-Object { $_.draft -and $_.tag_name -eq $tag } |
              Select-Object -First 1
            if ($draft) {
              $release = Invoke-RestMethod -Method Patch -Headers $headers -ContentType "application/json" -Uri "$apiBase/releases/$($draft.id)" -Body $payload
            } else {
              $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType "application/json" -Uri "$apiBase/releases" -Body $payload
            }
          }

          foreach ($assetPath in @("dist/copy-tree.exe", "dist/copy-tree-cli.exe", "dist/SHA256SUMS.txt")) {
            $assetName = Split-Path $assetPath -Leaf
            foreach ($asset in @($release.assets | Where-Object { $_.name -eq $assetName })) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "$apiBase/releases/assets/$($asset.id)" | Out-Null
            }
            $escapedName = [System.Uri]::EscapeDataString($assetName)
            $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$escapedName"
            Invoke-RestMethod -Method Post -Headers $headers -ContentType "application/octet-stream" -InFile $assetPath -Uri $uploadUrl | Out-Null
          }
